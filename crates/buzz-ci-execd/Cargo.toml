[package]
name = "buzz-ci-execd"
description = "Keyless, networkless privileged resource broker for Buzz CI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "buzz_ci_execd"
path = "src/lib.rs"

[[bin]]
name = "buzz-ci-execd"
path = "src/main.rs"

[dependencies]
buzz-ci-broker-protocol = { workspace = true }
buzz-ci-isolation-contract = { path = "../buzz-ci-isolation-contract" }
buzz-ci-materializer = { path = "../buzz-ci-materializer" }
buzz-ci-policy-proxy = { path = "../buzz-ci-policy-proxy" }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["dir", "fs", "process", "signal", "socket", "user"] }

[dev-dependencies]
tempfile = "3"
