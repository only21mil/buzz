[package]
name = "buzz-ci-runner"
description = "Unprivileged Buzz CI control process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "buzz_ci_runner"
path = "src/lib.rs"

[[bin]]
name = "buzz-ci-runner"
path = "src/main.rs"

[dependencies]
buzz-ci-broker-protocol = { workspace = true }
buzz-ci-controld = { workspace = true }
buzz-core = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = "=3.0.0-rc.0"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "poll", "process", "signal", "socket", "user"] }

[dev-dependencies]
tempfile = "3"
