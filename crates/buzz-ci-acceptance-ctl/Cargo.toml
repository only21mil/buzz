[package]
name = "buzz-ci-acceptance-ctl"
description = "Qualification-only control input for Buzz CI acceptance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "buzz_ci_acceptance_ctl"
path = "src/lib.rs"

[[bin]]
name = "buzz-ci-acceptance-ctl"
path = "src/main.rs"

[[bin]]
name = "buzz-ci-capacity-one-canary"
path = "src/bin/capacity_one_canary.rs"

[[bin]]
name = "buzz-ci-capacity-one-driver"
path = "src/bin/capacity_one_driver.rs"

[[bin]]
name = "buzz-ci-acceptance-control"
path = "src/bin/acceptance_control.rs"

[dependencies]
buzz-ci-broker-protocol = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "poll", "process", "socket", "user"] }
