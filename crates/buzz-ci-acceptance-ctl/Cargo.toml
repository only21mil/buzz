[package]
name = "buzz-ci-acceptance-ctl"
description = "Qualification-only control input for Buzz CI acceptance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = []

[lib]
name = "buzz_ci_acceptance_ctl"
path = "src/lib.rs"

[[bin]]
name = "buzz-ci-acceptance-ctl"
path = "src/main.rs"

[[bin]]
name = "buzz-ci-capacity-one-canary"
path = "src/bin/capacity_one_canary.rs"

[dependencies]
buzz-ci-broker-protocol = { workspace = true }
buzz-core = { workspace = true }
hex = { workspace = true }
nostr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs"] }

[dev-dependencies]
tempfile = "3"
