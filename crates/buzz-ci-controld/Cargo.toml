[package]
name = "buzz-ci-controld"
description = "Durable state core for the Buzz CI signing control service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "buzz_ci_controld"
path = "src/lib.rs"

[[bin]]
name = "buzz-ci-controld"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
buzz-ci-broker-protocol = { workspace = true }
buzz-ci-acceptance-ctl = { path = "../buzz-ci-acceptance-ctl" }
buzz-core = { workspace = true }
buzz-ci-keyholder = { workspace = true }
hex = { workspace = true }
nostr = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "poll", "socket", "user"] }

[dev-dependencies]
buzz-ci-acceptance-ctl = { path = "../buzz-ci-acceptance-ctl", features = ["test-support"] }
buzz-ci-execd = { path = "../buzz-ci-execd" }
tempfile = "3"
