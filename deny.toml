[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Pinned git deps: mesh-llm (v0.74.0 tag), nostr (RUSTSEC fixes at 94dac28e),
# rust-s3 fork (aws-creds patch for Blossom media).
allow-git = [
    "https://github.com/Mesh-LLM/mesh-llm",
    "https://github.com/nostrdevkit/nostr",
    "https://github.com/tlongwell-block/rust-s3",
]
unused-allowed-source = "allow"

