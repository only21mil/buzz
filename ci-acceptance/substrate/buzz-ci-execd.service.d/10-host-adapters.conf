[Unit]
Requires=systemd-tmpfiles-setup.service
After=local-fs.target systemd-tmpfiles-setup.service
RequiresMountsFor=/etc/buzzci/authority /etc/buzzci/qualification-cases /run/netns /var/lib/buzzci/activation /var/lib/buzzci/leases /var/lib/buzzci/seccomp/v1/sha256

[Service]
ReadOnlyPaths=/etc/buzzci/authority /etc/buzzci/qualification-cases /usr/share/containers/seccomp.json
ReadWritePaths=
ReadWritePaths=/run/buzzci /run/netns /var/lib/buzzci/activation /var/lib/buzzci/leases /var/lib/buzzci/seccomp/v1/sha256
