name: buzz-ci-phase2-probe

# Job-level `required` is the sole in-file source for signed manifest policy.
# The single required job is deliberate: slowpoke must exercise timed_out
# without preventing the attempt-2 verdict from becoming green.
on:
  workflow_dispatch:

jobs:
  ok:
    runs-on: linux
    timeout-minutes: 1
    required: false
    steps:
      - run: ./jobs/ok.sh
  flaky:
    runs-on: linux
    timeout-minutes: 1
    required: true
    steps:
      - run: ./jobs/flaky.sh
  never:
    runs-on: linux
    timeout-minutes: 1
    required: false
    steps:
      - run: ./jobs/never.sh
  slowpoke:
    runs-on: linux
    timeout-minutes: 1
    required: false
    steps:
      - run: ./jobs/slowpoke.sh
